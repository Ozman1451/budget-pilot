<!doctype html>
<html
  lang="en"
  data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Background","default":"#0A0A0F"},
  {"id":"color-ink","type":"color","label":"Text","default":"#EDEDF2"},
  {"id":"color-muted","type":"color","label":"Muted text","default":"#8A8A9A"},
  {"id":"color-magenta","type":"color","label":"Accent A","default":"#E94BA8"},
  {"id":"color-saffron","type":"color","label":"Accent B","default":"#F5A524"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- Real numbers: engine/optimizer.py on data/ads_100k.parquet + bench/results.csv (work/export_data.py) -->
    <script src="assets/data/bp.js"></script>
    <script src="assets/data/audio.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --color-ground: #0a0a0f;
        --color-surface: #12121a;
        --color-border: #23232f;
        --color-ink: #ededf2;
        --color-muted: #8a8a9a;
        --color-magenta: #e94ba8;
        --color-saffron: #f5a524;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        font-family: "Geist", sans-serif;
        color: var(--color-ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="48.1" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <!-- Scenes: every cut sits on a bar line of vol-9 (beat = 1.0706 + 0.52628·k) -->
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="48.1" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.28" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="curves" data-composition-id="curves" data-composition-src="compositions/curves.html" data-start="5.28" data-duration="5.26" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="method" data-composition-id="method" data-composition-src="compositions/method.html" data-start="10.54" data-duration="8.42" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="app" data-composition-id="app" data-composition-src="compositions/app.html" data-start="18.96" data-duration="5.27" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="answer" data-composition-id="answer" data-composition-src="compositions/answer.html" data-start="24.23" data-duration="6.31" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="depth" data-composition-id="depth" data-composition-src="compositions/depth.html" data-start="30.54" data-duration="7.89" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="scale" data-composition-id="scale" data-composition-src="compositions/scale.html" data-start="38.43" data-duration="4.21" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="42.64" data-duration="5.46" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>

      <!-- Music: Sascha Ende, ende.app (CC BY 4.0) -->
      <audio id="music" data-timeline-role="music" class="clip" data-start="0" data-duration="48.1" data-track-index="10" data-volume="0.34" data-fade-in="0.3" data-fade-out="2.4" src="assets/music/vol9.mp3"></audio>

      <!-- Hook: poker-chip lays under the five platform pills (half-beats) — the budget being placed -->
      <audio id="sfx-p1" class="clip" data-start="1.57" data-duration="0.18" data-track-index="11" data-volume="0.34" src="assets/sfx/chip-lay-1.ogg"></audio>
      <audio id="sfx-p2" class="clip" data-start="1.84" data-duration="0.18" data-track-index="12" data-volume="0.3" src="assets/sfx/chip-lay-2.ogg"></audio>
      <audio id="sfx-p3" class="clip" data-start="2.1" data-duration="0.18" data-track-index="13" data-volume="0.34" src="assets/sfx/chip-lay-3.ogg"></audio>
      <audio id="sfx-p4" class="clip" data-start="2.37" data-duration="0.18" data-track-index="14" data-volume="0.3" src="assets/sfx/chip-lay-1.ogg"></audio>
      <audio id="sfx-p5" class="clip" data-start="2.63" data-duration="0.18" data-track-index="15" data-volume="0.34" src="assets/sfx/chip-lay-2.ogg"></audio>
      <!-- Curves settle -->
      <audio id="sfx-curves" class="clip" data-start="7.36" data-duration="0.19" data-track-index="16" data-volume="0.5" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <!-- Bars balance at 2.42× -->
      <audio id="sfx-equal" class="clip" data-start="16.84" data-duration="0.13" data-track-index="17" data-volume="0.45" src="assets/sfx/bong_001.ogg"></audio>
      <!-- App: chip clicked -->
      <audio id="sfx-click" class="clip" data-start="20.16" data-duration="0.06" data-track-index="18" data-volume="0.42" src="assets/sfx/click2.ogg"></audio>
      <!-- Money moves to the new split, then the uplift lands -->
      <audio id="sfx-move" class="clip" data-start="25.26" data-duration="0.29" data-track-index="19" data-volume="0.4" src="assets/sfx/chips-stack-1.ogg"></audio>
      <audio id="sfx-uplift" class="clip" data-start="26.31" data-duration="0.57" data-track-index="20" data-volume="0.42" src="assets/sfx/impactSoft_heavy_002.ogg"></audio>
      <!-- Depth cards -->
      <audio id="sfx-c1" class="clip" data-start="30.5" data-duration="0.6" data-track-index="21" data-volume="0.33" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-c2" class="clip" data-start="33.13" data-duration="0.6" data-track-index="22" data-volume="0.33" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="sfx-c3" class="clip" data-start="35.76" data-duration="0.6" data-track-index="23" data-volume="0.33" src="assets/sfx/card-slide-1.ogg"></audio>
      <!-- 10,000,000 lands -->
      <audio id="sfx-scale" class="clip" data-start="39.46" data-duration="0.15" data-track-index="24" data-volume="0.48" src="assets/sfx/impactSoft_medium_004.ogg"></audio>
      <!-- Wordmark (beat 45.28) -->
      <audio id="sfx-logo" class="clip" data-start="45.25" data-duration="1.48" data-track-index="25" data-volume="0.48" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
